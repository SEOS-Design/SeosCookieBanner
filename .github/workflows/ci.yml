name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avbryt tidigare korningar pa samma branch nar en ny push kommer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Den byggda filen src/v1/banner.js ar committad i repot, eftersom Vercel
      # serverar src/ statiskt utan byggsteg. Risken med det ar att nagon andrar
      # kallkoden men glommer bygga om - da ligger gammal kod kvar pa CDN:et
      # medan diffen ser korrekt ut. Har byggs den om och jamfors: skiljer den
      # sig ett enda tecken, felar bygget.
      - name: Kontrollera att den byggda filen ar aktuell
        run: |
          npm run build
          if ! git diff --exit-code -- src/v1/banner.js; then
            echo "::error::src/v1/banner.js matchar inte kallkoden. Kor 'npm run build' och committa resultatet."
            exit 1
          fi

      - name: Installera Playwright-browser
        run: npx playwright install --with-deps chromium

      - name: Kor tester
        # Testerna kor mot en lokal statisk server och blockerar Facebook,
        # sa CI kontaktar varken produktions-API:t eller nagon tredje part.
        run: npm test
        env:
          CI: "true"

      - name: Ladda upp rapport vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

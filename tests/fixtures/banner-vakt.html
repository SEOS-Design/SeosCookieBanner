<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Testsida — vakten (C5 punkt 5)</title>

    <!--
      VAKTEN. Ligger först, före allt annat — precis som hos en kund.
      Innehållet genereras av bygget från samma källa som guard-snippet.html;
      ett test kontrollerar att de två inte driver isär.
    -->
    <script src="/tests/fixtures/vakt.js"></script>
  </head>
  <body>
    <h1>Vakten</h1>

    <script>
      // Härmar hur en tredjepartstjänst faktiskt laddas: en liten loader som
      // skapar ett skript i JavaScript. Det är precis det vakten finns för —
      // ingen HTML-rad att märka.
      //
      // ⚠️ RIKTIGA VÄRDNAMN. Vakten matchar på värdnamnet, inte på adressen
      // som text, så en testadress med spårarnamnet i sökvägen bevisar
      // ingenting. Testerna fångar upp anropen med page.route().
      window.SEOS_TEST = { forsokt: [] };

      window.laddaSparare = function (url) {
        window.SEOS_TEST.forsokt.push(url);
        const s = document.createElement('script');
        s.src = url;
        document.head.appendChild(s);
        return s;
      };

      // Meta (marknadsföring) och Hotjar (analys) — två olika kategorier, så
      // testerna kan skilja dem åt.
      window.laddaSparare('https://connect.facebook.net/en_US/fbevents.js');
      window.laddaSparare('https://static.hotjar.com/c/hotjar-123.js');

      // En tjänst som INTE står i listan. Ska laddas som vanligt — denylist,
      // aldrig allowlist.
      window.laddaSparare('https://exempel-tredjepart.se/widget.js');
    </script>

    <script src="/src/v1/banner.js" data-site-key="pk_test_vakt" async></script>
  </body>
</html>
